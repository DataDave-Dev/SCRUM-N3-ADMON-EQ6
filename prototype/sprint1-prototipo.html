<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprint en la escuela - Prototipo Sprint 1</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--deep:#12261f;--chalk:#f5f2e6;--yel:#ffd84d;--pink:#ff7aa8;--blue:#4aa3ff;--red:#ec4b3f;--grn:#5cc46a;--ink:#14213d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--deep);color:var(--chalk);font:600 18px/1.45 Nunito,Helvetica,Arial,sans-serif;min-height:100vh}
#bg{position:fixed;inset:0;background:var(--deep) center/cover;filter:brightness(.36) saturate(1.1) blur(2px);transform:scale(1.05)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
main{position:relative;max-width:720px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,.d{font-family:"Baloo 2",Nunito,Helvetica,sans-serif;font-weight:800;line-height:1.02;margin:0}
h1{font-size:clamp(46px,13vw,84px);text-shadow:4px 4px 0 var(--pink),8px 8px 0 rgba(0,0,0,.3)}h2{font-size:28px}p{margin:0}.ctr{text-align:center}
button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
.go{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:26px;background:var(--yel);color:var(--ink);border-radius:18px;padding:10px 26px;box-shadow:0 6px 0 #b98f00}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #b98f00}
.ghost{background:none;border:3px dashed var(--chalk);border-radius:16px;padding:10px 18px;font-weight:800}
.pi{display:block;width:100%;text-align:left;color:var(--ink);font-weight:800;font-size:18px;padding:16px 18px;border-radius:6px 14px 8px 12px;background:var(--yel);box-shadow:0 6px 14px rgba(0,0,0,.4);transition:transform .15s}
.pi:nth-child(3n+1){transform:rotate(-.5deg)}.pi:nth-child(3n+2){background:#ff9fc0;transform:rotate(.8deg)}.pi:nth-child(3n){background:#8ec8ff;transform:rotate(-.8deg)}
.pi:hover{transform:rotate(0) translateY(-3px)}.pi.sel{outline:4px solid var(--chalk)}
.pi.w{background:var(--chalk);transform:none}.pi.k0{background:#ffd84d}.pi.k1{background:#ff9fc0}.pi.k2{background:#8ec8ff}
#ob{display:flex;flex-direction:column;gap:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cl{background:var(--chalk);color:var(--ink);border:6px solid var(--c);border-radius:36px;padding:12px 18px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.cl b{display:block;color:var(--c);font-family:"Baloo 2",sans-serif;font-size:20px}
.scn{position:relative;height:210px;border-radius:22px;overflow:hidden;background:center/cover;border:4px solid var(--chalk);box-shadow:0 10px 0 rgba(0,0,0,.3)}
.scn img{position:absolute;bottom:0;left:10px;height:200px;animation:bob 2.6s ease-in-out infinite;transform-origin:bottom}.scn img.r{left:auto;right:10px}
@keyframes bob{50%{transform:scaleY(1.03) translateY(-5px)}}.gp{width:100%;animation:bob 3s ease-in-out infinite}
.hud{display:flex;justify-content:space-between;gap:10px;background:rgba(10,24,20,.75);border:3px solid var(--chalk);border-radius:18px;padding:6px 14px;font:800 22px "Baloo 2",sans-serif}
.hd{color:var(--red);letter-spacing:2px}.hd i{font-style:normal;opacity:.25}
.seg{display:flex;gap:4px}.seg i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.25)}.seg i.on{background:var(--grn)}.seg i.bad{background:var(--red)}
.tm{height:10px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}.tm b{display:block;height:100%;width:100%;background:var(--yel)}
.mp{display:flex;flex-direction:column;justify-content:flex-end;min-height:130px;padding:14px 18px;border-radius:20px;background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,.1)),var(--im) center/cover;border:4px solid var(--chalk);text-align:left;font:800 24px "Baloo 2",sans-serif}
.mp small{font:600 16px Nunito,sans-serif}.mp:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}.mp:not(:disabled):hover{transform:scale(1.02)}
.st{display:flex;gap:8px;justify-content:center;font-size:72px;color:var(--yel)}.st span{animation:pop .5s both}.st .off{color:rgba(255,255,255,.25)}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}}
.ch{display:inline-block;background:var(--grn);color:var(--ink);border-radius:20px;padding:4px 14px;font-weight:800;margin:3px}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#mt{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:10;background:rgba(0,0,0,.55);border-radius:12px;padding:6px 12px;font-weight:800;font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="bg"></div><canvas id="cf"></canvas>
<button id="mt" onclick="mute=!mute;this.textContent=mute?'Sonido: no':'Sonido: sí'">Sonido: sí</button><main id="app"></main>

const $=s=>document.querySelector(s),app=$("#app"),bg=$("#bg"),rnd=a=>[...a].sort(()=>Math.random()-.5);
let S,TW,TM,AC,mute=false;
const view=h=>{app.innerHTML=h;window.scrollTo(0,0)},setbg=k=>bg.style.backgroundImage=`url(${IMG[k]})`;
const cloud=(k,t)=>`<div class="cl" style="--c:${CH[k][1]}"><b>${CH[k][0]}</b>${t}</div>`;
const best=()=>{try{return +localStorage.getItem("sprint-best")||0}catch(e){return 0}},save=v=>{try{localStorage.setItem("sprint-best",v)}catch(e){}};
function snd(f,d=.12,t="sine"){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const sOk=()=>{snd(660);setTimeout(()=>snd(880),90)},sNo=()=>snd(150,.3,"sawtooth"),sWin=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.2),i*110));
const cv=$("#cf"),cx=cv.getContext("2d");let P=[];
function boom(n){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;cv.width=innerWidth;cv.height=innerHeight;const e=!P.length;for(let i=0;i<n;i++)P.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:Math.random()*-13-3,c:["#ffd84d","#ff7aa8","#4aa3ff","#5cc46a","#ec4b3f"][i%5],s:5+Math.random()*7,r:Math.random()*6});if(e)tick()}
function tick(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});P=P.filter(p=>p.y<cv.height+20);P.length?requestAnimationFrame(tick):cx.clearRect(0,0,cv.width,cv.height)}
function say(el,txt){clearInterval(TW);let i=0;TW=setInterval(()=>{el.textContent=txt.slice(0,++i);if(i>=txt.length)clearInterval(TW)},16);el.onclick=()=>{clearInterval(TW);el.textContent=txt}}
const hud=()=>`<div class="hud"><span class="hd">${"♥".repeat(S.v)}<i>${"♥".repeat(3-S.v)}</i></span><span>${S.p} pts</span><span>${S.r>1?"Racha x"+S.r:"Sin racha"}</span></div><div class="seg">${S.log.concat(Array(12-S.log.length).fill(0)).map(x=>`<i class="${x==1?"on":x==2?"bad":""}"></i>`).join("")}</div>`;
function home(){S=null;clearInterval(TM);setbg("b0");view(`<img class="gp" src="${IMG.group}" alt="Beto, Riqui, Lili, El Inge Morales, Toño y Pau"><h1>Sprint en la escuela</h1><p>Ayuda a Beto, Riqui, Lili, Pau y Toño a terminar su videojuego resolviendo 12 retos de SCRUM por la escuela.</p><div class="ctr"><button class="go" onclick="start()">Jugar</button> <button class="ghost" onclick="how()">Cómo se juega</button></div><p class="ctr">Mejor puntaje: ${best()} de 120. Prototipo del Sprint 1, Equipo 6 SCRUM.</p>`)}
function how(){view(`<h2>Cómo se juega</h2>`+cloud("inge","Recorre tres escenarios de la escuela. Cada uno tiene 4 retos: de opción múltiple, de ordenar y de relacionar.")+cloud("lili","Empiezas con 3 vidas. Cada acierto suma 10 puntos y cada error quita una vida. Tienes tiempo limitado por reto.")+cloud("tono","Si encadenas aciertos haces racha. Termina los tres escenarios con al menos una vida para ganar.")+`<button class="go" onclick="home()">Entendido</button>`)}
function start(){S={v:3,p:0,r:0,mr:0,log:[],s:0,q:0,li:0,done:[0,0,0],sp:[0,0,0],fast:0,fails:[]};map()}

function intro(){const c=SC[S.s],L=c.intro,[k,t]=L[S.li],ks=[...new Set(L.map(x=>x[0]))].slice(0,2);setbg(c.bg);
view(hud()+`<div class="scn" style="background-image:url(${IMG[c.bg]})">${ks.map((x,i)=>`<img class="${i?"r":""}" style="${x==k?"":"filter:brightness(.6)"}" src="${IMG[x]}" alt="">`).join("")}</div><div class="cl" style="--c:${CH[k][1]}"><b>${CH[k][0]}</b><span id="tx"></span></div><button class="go" id="nx">${S.li<L.length-1?"Siguiente":"Empezar el reto"}</button>`);
say($("#tx"),t);$("#nx").onclick=()=>{clearInterval(TW);if(S.li<L.length-1){S.li++;intro()}else{S.q=0;reto()}}}

else{S.o=rnd(q.t=="ord"?q.items.map((x,i)=>i):q.pairs.map((x,i)=>i));b=`<div id="ob"></div><button class="go" onclick="chk()">Comprobar</button>`}

function draw(){const q=SC[S.s].qs[S.q],o=$("#ob");if(!o)return;
if(q.t=="ord")o.innerHTML=S.o.map(i=>{const n=S.sel.indexOf(i);return`<button class="pi ${n>=0?"sel":""}" onclick="pick(${i})">${n>=0?"<u>"+(n+1)+"</u> ":""}${q.items[i]}</button>`}).join("");
else o.innerHTML=`<div class="g2">`+q.pairs.map((p,i)=>{const j=S.o[i],k=Object.keys(S.pr).find(x=>S.pr[x]==j);return`<button class="pi ${S.pr[i]!=null?"k"+i:S.cur==i?"sel":"w"}" onclick="L(${i})">${p[0]}</button><button class="pi ${k!=null?"k"+k:"w"}" onclick="R(${j})">${q.pairs[j][1]}</button>`}).join("")+`</div>`}
function pick(i){const n=S.sel.indexOf(i);n>=0?S.sel.splice(n):S.sel.push(i);draw()}
function L(i){S.cur=i;draw()}
function R(j){if(S.cur==null)return;for(const k in S.pr)if(S.pr[k]==j)delete S.pr[k];S.pr[S.cur]=j;S.cur=null;draw()}
function chk(){const q=SC[S.s].qs[S.q];if(q.t=="ord"){if(S.sel.length<q.items.length)return;done(S.sel.every((v,i)=>v==i)?1:0)}else{if(Object.keys(S.pr).length<q.pairs.length)return;done(q.pairs.every((x,i)=>S.pr[i]==i)?1:0)}}
function done(ok,to){clearInterval(TM);const c=SC[S.s],q=c.qs[S.q],sec=(Date.now()-S.t0)/1e3;
if(ok){S.p+=10;S.sp[S.s]+=10;S.r++;S.mr=Math.max(S.mr,S.r);if(sec<10)S.fast++;sOk()}else{S.v--;S.r=0;S.fails.push(q.e);sNo()}
S.log.push(ok?1:2);
const m=ok?"¡Correcto! "+(S.r>=3?"Llevas una racha de "+S.r+". ":""):(to?"Se acabó el tiempo. ":"Casi. ")+(q.c?"La respuesta era “"+q.c+"”. ":"");
view(hud()+`<div class="scn" style="background-image:url(${IMG[c.bg]})"><img src="${IMG[S.g+(ok?1:2)]}" alt="" style="height:170px"></div>`+cloud(S.g,m+q.e)+`<button class="go" onclick="nxt()">Continuar</button>`);
if(!ok){app.classList.add("shake");setTimeout(()=>app.classList.remove("shake"),450)}}
function nxt(){if(!S.v)return dead();S.q++;S.q<4?reto():resSc()}
function resSc(){S.done[S.s]=1;const all=S.done.every(x=>x),sc=S.sp[S.s];if(sc>=30)boom(90);
view(hud()+`<h2>${SC[S.s].t}: completado</h2><p class="d ctr" style="font-size:72px;color:var(--yel)">${sc} / 40</p>`+cloud("inge",sc==40?"¡Perfecto! Así se avanza en Scrum: una meta pequeña a la vez.":"Bien hecho. Cada Sprint deja algo que mejorar.")+`<button class="go" onclick="${all?"end()":"map()"}">${all?"Ver resultados":"Volver al mapa"}</button>`)}
function end(){const p=S.p,n=p>=90?3:p>=60?2:1,rk=p>=100?"Maestro Scrum":p>=80?"Desarrollador pro":p>=60?"Desarrollador en práctica":"Aprendiz como Beto",B=[],nb=p>best();
if(!S.log.includes(2))B.push("Sin errores");if(S.mr>=6)B.push("Racha de "+S.mr);if(S.fast>=6)B.push("Velocista");if(nb)save(p);setbg("b2");
view(`<h1 class="ctr" style="font-size:clamp(38px,10vw,64px)">Juego completado</h1><div class="st">${[1,2,3].map(i=>`<span class="${i>n?"off":""}" style="animation-delay:${i*.3}s">★</span>`).join("")}</div><p class="d ctr" style="font-size:56px">${p} <small style="font-size:24px">de 120 puntos</small></p><p class="ctr"><b>${rk}</b>${nb?". Nuevo mejor puntaje":""}</p><div class="ctr">${B.map(b=>`<span class="ch">${b}</span>`).join("")}</div>`+cloud("pau","Valió la pena el esfuerzo. Con Scrum, ¡hasta Beto terminó a tiempo!")+`<img class="gp" src="${IMG.group}" alt=""><div class="ctr"><button class="go" onclick="start()">Jugar de nuevo</button> <button class="ghost" onclick="home()">Inicio</button></div>`);sWin();boom(220)}
function dead(){view(`<h1>Se acabaron las vidas</h1><div class="scn" style="background-image:url(${IMG[SC[S.s].bg]})"><img src="${IMG.inge2}" alt="" style="height:170px"></div>`+cloud("tono","Los errores son normales: se prueba, se anota y se corrige en el siguiente Sprint. Repasa esto:<br>"+S.fails.slice(-3).map(x=>"• "+x).join("<br>"))+`<button class="go" onclick="start()">Reintentar</button> <button class="ghost" onclick="home()">Inicio</button>`)}
home();
</script></body></html>
